<header class="topbar">
  <h1>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9Z" />
      <path d="M3.5 7.5 12 12.5l8.5-5M12 12.5v9" />
    </svg>
    Fiasco
  </h1>
  @if (session.username(); as username) {
    <div class="user">
      <span class="label">Signed in as <strong>{{ username }}</strong></span>
      <button class="ghost" (click)="logout()">Log out</button>
    </div>
  }
</header>

<main>
  @switch (view()) {
    @case ('login') { <app-login /> }
    @case ('lobby') { <app-lobby /> }
    @case ('room') { <app-room /> }
  }
</main>
